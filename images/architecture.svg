  <text x="610" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" font-family="monospace">notebooks/01_basis_analysis.ipynb</text>
  <text x="270" y="420" font-size="13" fill="#c9d3d8">&#8226; merge_asof join (aligns Wednesday basis dates to Friday storage dates)</text>
