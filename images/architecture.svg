  <text x="220" y="192" text-anchor="middle" font-size="14" font-family="monospace" fill="#1a2530">extract_fred.py</text>

  <rect x="430" y="150" width="360" height="70" rx="10" fill="#ffffff" stroke="#10202b" stroke-width="2"/>
  <text x="610" y="183" text-anchor="middle" font-size="14" font-family="monospace" fill="#1a2530">parse_waha_weekly.py</text>
  <text x="610" y="201" text-anchor="middle" font-size="12" fill="#8a95a0">regex parser</text>

  <rect x="820" y="150" width="360" height="70" rx="10" fill="#ffffff" stroke="#10202b" stroke-width="2"/>
