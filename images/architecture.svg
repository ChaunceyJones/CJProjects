  <text x="220" y="82" text-anchor="middle" font-size="13" fill="#4a5560">Henry Hub daily spot price</text>

  <rect x="430" y="30" width="360" height="80" rx="10" fill="#fdf1e2" stroke="#e2984a" stroke-width="2"/>
