  <line x1="610" y1="220" x2="610" y2="270" stroke="#6b7b85" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="220" x2="920" y2="270" stroke="#6b7b85" stroke-width="2" marker-end="url(#arrow)"/>

